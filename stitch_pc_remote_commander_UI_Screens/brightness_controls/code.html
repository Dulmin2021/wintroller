<script>
        // Simple Interaction Logic for the Slider and Presets
        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('verticalSlider');
            const fill = document.getElementById('sliderFill');
            const thumb = document.getElementById('sliderThumb');
            const display = document.getElementById('brightnessValueDisplay');
            const presets = document.querySelectorAll('.preset-btn');
            
            let isDragging = false;

            const updateSlider = (percentage) => {
                // Clamp between 0 and 100
                percentage = Math.max(0, Math.min(100, Math.round(percentage)));
                
                fill.style.height = `${percentage}%`;
                thumb.style.bottom = `calc(${percentage}% - 2px)`;
                display.textContent = `${percentage}%`;

                // Update preset button states visually
                presets.forEach(btn => {
                    if (parseInt(btn.dataset.value) === percentage) {
                        btn.classList.remove('bg-transparent', 'border-outline-variant', 'text-on-surface-variant');
                        btn.classList.add('bg-primary', 'text-on-primary', 'border-transparent', 'shadow-md');
                    } else {
                        btn.classList.add('bg-transparent', 'border-outline-variant', 'text-on-surface-variant');
                        btn.classList.remove('bg-primary', 'text-on-primary', 'border-transparent', 'shadow-md');
                    }
                });
            };

            const calculatePercentage = (clientY) => {
                const rect = slider.getBoundingClientRect();
                // Y increases downwards, so we invert the calculation for a bottom-up slider
                const yPos = rect.bottom - clientY;
                const percentage = (yPos / rect.height) * 100;
                return percentage;
            };

            // Touch / Mouse Events for Slider
            const startDrag = (e) => {
                isDragging = true;
                slider.classList.add('slider-thumb-active');
                updateFromEvent(e);
            };

            const doDrag = (e) => {
                if (!isDragging) return;
                e.preventDefault(); // Prevent scrolling while sliding
                updateFromEvent(e);
            };

            const endDrag = () => {
                isDragging = false;
                slider.classList.remove('slider-thumb-active');
            };

            const updateFromEvent = (e) => {
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                updateSlider(calculatePercentage(clientY));
            };

            slider.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', endDrag);

            slider.addEventListener('touchstart', startDrag, { passive: false });
            document.addEventListener('touchmove', doDrag, { passive: false });
            document.addEventListener('touchend', endDrag);

            // Preset Button Clicks
            presets.forEach(btn => {
                btn.addEventListener('click', () => {
                    const value = parseInt(btn.dataset.value);
                    updateSlider(value);
                });
            });
        });
    </script>
