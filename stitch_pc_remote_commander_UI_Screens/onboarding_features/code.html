<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Proton Remote - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#00311f",
                        "surface-container": "#171f33",
                        "inverse-primary": "#005ac2",
                        "primary": "#adc6ff",
                        "inverse-on-surface": "#283044",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed": "#001a42",
                        "surface-tint": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "surface-container-lowest": "#060e20",
                        "surface-bright": "#31394d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-low": "#131b2e",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface": "#dae2fd",
                        "on-secondary-container": "#a9bad3",
                        "outline-variant": "#424754",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-container": "#00a572",
                        "inverse-surface": "#dae2fd",
                        "on-surface-variant": "#c2c6d6",
                        "on-error-container": "#ffdad6",
                        "background": "#0b1326",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#0b1c30",
                        "surface": "#0b1326",
                        "on-tertiary-fixed": "#002113",
                        "on-background": "#dae2fd",
                        "on-tertiary": "#003824",
                        "surface-variant": "#2d3449",
                        "surface-dim": "#0b1326",
                        "surface-container-high": "#222a3d",
                        "on-secondary": "#213145",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#d8e2ff",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#004395",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#00285d",
                        "secondary-container": "#3a4a5f",
                        "on-tertiary-fixed-variant": "#005236",
                        "tertiary": "#4edea3",
                        "outline": "#8c909f",
                        "on-primary": "#002e6a",
                        "secondary": "#b7c8e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "mono-ui": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "mono-ui": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-active {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle pulsing animation for the active indicator in onboarding */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .pulse-effect::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-color: inherit;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed TopAppBar and BottomNavBar as this is a linear transactional/onboarding screen -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile relative z-10 w-full max-w-md mx-auto h-[100dvh]">
<!-- Background decorative elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[10%] left-[20%] w-[300px] h-[300px] bg-primary/5 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[20%] right-[10%] w-[250px] h-[250px] bg-tertiary/5 rounded-full blur-[60px]"></div>
</div>
<!-- Content Container -->
<div class="flex flex-col w-full items-center text-center space-y-stack-lg flex-grow justify-center">
<!-- Graphic/Icon Grid Section -->
<div class="relative w-full aspect-square max-w-[280px] mb-stack-md">
<div class="absolute inset-0 bg-surface-container-low rounded-2xl border border-surface-container-high rotate-3 transition-transform duration-700 ease-out"></div>
<div class="absolute inset-0 bg-surface-container rounded-2xl border border-surface-container-highest flex flex-col p-gutter justify-between shadow-lg shadow-black/20 z-10">
<div class="grid grid-cols-2 gap-gutter h-full">
<!-- Power Tile -->
<div class="bg-surface-container-high rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-stack-sm hover:border-primary transition-colors duration-300 group">
<div class="h-12 w-12 rounded-full bg-surface flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-3xl group-hover:icon-active" data-icon="power_settings_new">power_settings_new</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors duration-300">Power</span>
</div>
<!-- Mouse Tile -->
<div class="bg-surface-container-high rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-stack-sm hover:border-primary transition-colors duration-300 group">
<div class="h-12 w-12 rounded-full bg-surface flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-3xl group-hover:icon-active" data-icon="mouse">mouse</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors duration-300">Mouse</span>
</div>
<!-- Keyboard Tile -->
<div class="bg-surface-container-high rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-stack-sm hover:border-primary transition-colors duration-300 group">
<div class="h-12 w-12 rounded-full bg-surface flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-3xl group-hover:icon-active" data-icon="keyboard">keyboard</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors duration-300">Keyboard</span>
</div>
<!-- Media Tile -->
<div class="bg-surface-container-high rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-stack-sm hover:border-primary transition-colors duration-300 group">
<div class="h-12 w-12 rounded-full bg-surface flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-3xl group-hover:icon-active" data-icon="play_circle">play_circle</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors duration-300">Media</span>
</div>
</div>
</div>
</div>
<!-- Typography Section -->
<div class="space-y-stack-sm w-full">
<h1 class="font-headline-lg text-headline-lg text-on-background">What you can control</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    One app for all your remote needs. Seamlessly manage your PC environment from anywhere.
                </p>
</div>
</div>
<!-- Bottom Action Area -->
<div class="w-full mt-auto pt-stack-lg flex flex-col items-center gap-stack-md pb-safe">
<!-- Progress Indicators -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-6 h-2 rounded-full bg-primary relative pulse-effect"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Next Button -->
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors duration-200 active:scale-95 group">
                Next
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform duration-200" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Skip Link (Ghost action) -->
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors duration-200 py-2">
                Skip onboarding
            </button>
</div>
</main>
<script>
        // Simple entrance animation for the grid tiles
        document.addEventListener('DOMContentLoaded', () => {
            const tiles = document.querySelectorAll('.grid > div');
            tiles.forEach((tile, index) => {
                tile.style.opacity = '0';
                tile.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    tile.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
                    tile.style.opacity = '1';
                    tile.style.transform = 'translateY(0)';
                }, 100 + (index * 150));
            });
        });
    </script>
</body></html>
