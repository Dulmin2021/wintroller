<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* Hide scrollbar for clean UI but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;

<body class="font-body-md text-body-md antialiased min-h-screen flex flex-col pb-[80px] pt-[64px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface border-b border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="settings_remote">settings_remote</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary">Proton Remote</span>
</div>
<div class="flex items-center gap-4">
<div class="relative w-full max-w-xs md:flex hidden mr-4">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="search">search</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-full pl-10 pr-4 py-1.5 font-label-lg text-label-lg text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="Search files..." type="text"/>
</div>
<button class="md:hidden w-touch-target-min h-touch-target-min flex items-center justify-center hover:bg-surface-container-highest rounded-full transition-colors duration-200 active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center hover:bg-surface-container-highest rounded-full transition-colors duration-200 active:scale-95 text-primary">

</button>
</div>
</header>
<main class="flex-1 px-margin-mobile py-stack-md flex flex-col gap-stack-lg max-w-5xl mx-auto w-full">

<div class="flex items-center justify-between">
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar font-mono-ui text-mono-ui text-on-surface-variant">
<button class="hover:text-primary transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[16px]" data-icon="hard_drive">hard_drive</span> C:</button>
<span class="material-symbols-outlined text-[16px]" data-icon="chevron_right">chevron_right</span>
<button class="hover:text-primary transition-colors">Users</button>
<span class="material-symbols-outlined text-[16px]" data-icon="chevron_right">chevron_right</span>
<button class="hover:text-primary transition-colors">Admin</button>
<span class="material-symbols-outlined text-[16px]" data-icon="chevron_right">chevron_right</span>
<span class="text-on-surface">Documents</span>
</div>
<div class="hidden md:flex gap-2">
<button class="h-touch-target-min px-4 rounded-lg bg-surface-container hover:bg-surface-container-high border border-outline-variant flex items-center gap-2 text-on-surface font-label-lg text-label-lg transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="grid_view">grid_view</span> View
                </button>
<button class="h-touch-target-min px-4 rounded-lg bg-surface-container hover:bg-surface-container-high border border-outline-variant flex items-center gap-2 text-on-surface font-label-lg text-label-lg transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="sort">sort</span> Sort
                </button>
</div>
</div>
<!-- File List Container -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl overflow-hidden shadow-sm">
<!-- List Header (Desktop) -->
<div class="hidden md:grid grid-cols-[auto_1fr_120px_150px_auto] gap-4 items-center px-4 py-3 bg-surface-container-high border-b border-outline-variant font-label-sm text-label-sm text-on-surface-variant">
<div class="w-8"></div>
<div>Name</div>
<div class="text-right">Size</div>
<div class="text-right">Modified</div>
<div class="w-8"></div>
</div>
<!-- List Items -->
<div class="flex flex-col">
<!-- Folder Item -->
<button class="grid grid-cols-[auto_1fr_auto] md:grid-cols-[auto_1fr_120px_150px_auto] gap-4 items-center px-4 py-3 border-b border-outline-variant/50 hover:bg-surface-container-highest transition-colors group text-left w-full h-[64px] md:h-auto">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="folder" data-weight="fill">folder</span>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors truncate">Project Titan</span>
<span class="font-label-sm text-label-sm text-on-surface-variant md:hidden">Folder • 10/24/2023</span>
</div>

</button>

<button class="grid grid-cols-[auto_1fr_auto] md:grid-cols-[auto_1fr_120px_150px_auto] gap-4 items-center px-4 py-3 border-b border-outline-variant/50 hover:bg-surface-container-highest transition-colors group text-left w-full h-[64px] md:h-auto">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="folder" data-weight="fill">folder</span>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors truncate">Q4 Reports</span>
<span class="font-label-sm text-label-sm text-on-surface-variant md:hidden">Folder • 10/12/2023</span>
</div>
<span class="font-mono-ui text-mono-ui text-on-surface-variant text-right hidden md:block">--</span>
<span class="font-mono-ui text-mono-ui text-on-surface-variant text-right hidden md:block">10/12/2023</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface hidden md:block" data-icon="more_vert">more_vert</span>
</button>
<!-- PDF Item -->
<button class="grid grid-cols-[auto_1fr_auto] md:grid-cols-[auto_1fr_120px_150px_auto] gap-4 items-center px-4 py-3 border-b border-outline-variant/50 hover:bg-surface-container-highest transition-colors group text-left w-full h-[64px] md:h-auto focus:bg-surface-container-highest focus:outline-none">
<span class="material-symbols-outlined text-error text-[28px]" data-icon="picture_as_pdf">picture_as_pdf</span>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors truncate">Financial_Summary_2023.pdf</span>

</div>
<span class="font-mono-ui text-mono-ui text-on-surface-variant text-right hidden md:block">2.4 MB</span>
<span class="font-mono-ui text-mono-ui text-on-surface-variant text-right hidden md:block">11/02/2023</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface hidden md:block" data-icon="more_vert">more_vert</span>
</button>

<div class="w-[28px] h-[28px] rounded overflow-hidden border border-outline-variant shrink-0 flex items-center justify-center bg-surface-container">
<span class="material-symbols-outlined text-tertiary text-[20px]" data-icon="image">image</span>
</div>
<div class="flex flex-col">

</button>

</div>

<span class="font-mono-ui text-mono-ui text-on-surface-variant text-right hidden md:block">11/05/2023</span>

</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-transform duration-150 active:scale-90" href="#">
