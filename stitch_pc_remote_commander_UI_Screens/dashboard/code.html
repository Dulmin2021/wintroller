<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Proton Remote - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

          theme: {

                      "surface-container-lowest": "#060e20",
                      "surface-bright": "#31394d",

                      "surface-container-low": "#131b2e",
                      "secondary-fixed": "#d3e4fe",
                      "on-surface": "#dae2fd",

                      "outline-variant": "#424754",
                      "tertiary-fixed-dim": "#4edea3",
                      "tertiary-container": "#00a572",
                      "inverse-surface": "#dae2fd",
                      "on-surface-variant": "#c2c6d6",
                      "on-error-container": "#ffdad6",
                      "background": "#0b1326",
                      "error": "#ffb4ab",
                      "on-secondary-fixed": "#0b1c30",
                      "surface": "#0b1326",
                      "on-tertiary-fixed": "#002113",
                      "on-background": "#dae2fd",
                      "on-tertiary": "#003824",
                      "surface-variant": "#2d3449",
                      "surface-dim": "#0b1326",
                      "surface-container-high": "#222a3d",
                      "on-secondary": "#213145",
                      "tertiary-fixed": "#6ffbbe",
                      "primary-fixed": "#d8e2ff",
                      "on-error": "#690005",
                      "on-primary-fixed-variant": "#004395",
                      "primary-fixed-dim": "#adc6ff",
                      "on-primary-container": "#00285d",
                      "secondary-container": "#3a4a5f",
                      "on-tertiary-fixed-variant": "#005236",
                      "tertiary": "#4edea3",
                      "outline": "#8c909f",
                      "on-primary": "#002e6a",
                      "secondary": "#b7c8e1"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "24px",
                      "margin-mobile": "20px",
                      "gutter": "16px",
                      "stack-md": "16px",
                      "stack-sm": "8px",
                      "touch-target-min": "48px"
              },
              "fontFamily": {
                      "body-lg": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-sm": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Inter"
                      ],
                      "label-lg": [
                              "Inter"
                      ],
                      "label-sm": [
                              "Inter"
                      ],
                      "mono-ui": [
                              "JetBrains Mono"
                      ]
              },
              "fontSize": {
                      "body-lg": [
                              "18px",

                      ],

                      "headline-lg": [

                      "mono-ui": [

          },

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden pt-[48px] pb-[80px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface dark:bg-surface text-primary dark:text-primary font-headline-sm text-headline-sm border-b border-outline-variant dark:border-outline-variant transition-colors duration-200">
<div class="flex items-center gap-2">
<button class="hover:bg-surface-container-highest dark:hover:bg-surface-container-highest p-2 rounded-full active:scale-95 transition-transform flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined text-primary dark:text-primary" style="font-variation-settings: 'FILL' 0;">settings_remote</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary dark:text-primary">Proton Remote</h1>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container-high rounded-full border border-outline-variant">
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
<span class="font-label-sm text-label-sm text-on-surface">Gaming-PC (100%)</span>
</div>
<button class="hover:bg-surface-container-highest dark:hover:bg-surface-container-highest p-2 rounded-full active:scale-95 transition-transform flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined text-primary dark:text-primary" style="font-variation-settings: 'FILL' 0;">sensors</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-stack-lg flex flex-col gap-stack-lg w-full max-w-4xl mx-auto">
<!-- Status Card -->
<section class="bg-surface-container rounded-xl border border-outline-variant p-4 flex flex-col gap-3">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">System Status</h2>
<div class="grid grid-cols-2 gap-4">
<!-- CPU -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface">CPU Usage</span>
<span class="font-mono-ui text-mono-ui text-tertiary">42%</span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-tertiary rounded-full w-[42%]"></div>
</div>
</div>
<!-- RAM -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface">RAM Usage</span>
<span class="font-mono-ui text-mono-ui text-primary">68%</span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-[68%]"></div>
</div>
</div>
</div>
</section>
<!-- Quick Action Tiles Grid -->
<section class="grid grid-cols-2 md:grid-cols-3 gap-gutter">
<!-- Power (Red) -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-2 aspect-square active:scale-95 active:border-error active:bg-surface hover:bg-surface-container-highest transition-all duration-150 group">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-error-container group-hover:text-on-error-container transition-colors">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-error" style="font-variation-settings: 'FILL' 0;">power_settings_new</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Power</span>
</button>
<!-- Mouse (Blue) -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-2 aspect-square active:scale-95 active:border-primary active:bg-surface hover:bg-surface-container-highest transition-all duration-150 group">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-primary" style="font-variation-settings: 'FILL' 0;">mouse</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Mouse</span>
</button>
<!-- Keyboard (Blue) -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-2 aspect-square active:scale-95 active:border-primary active:bg-surface hover:bg-surface-container-highest transition-all duration-150 group">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-primary" style="font-variation-settings: 'FILL' 0;">keyboard</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Keyboard</span>
</button>
<!-- Media (Green) -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-2 aspect-square active:scale-95 active:border-tertiary active:bg-surface hover:bg-surface-container-highest transition-all duration-150 group">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-tertiary-container group-hover:text-on-tertiary-container transition-colors">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-tertiary" style="font-variation-settings: 'FILL' 0;">play_circle</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Media</span>
</button>
<!-- Files (Orange - mapping to primary variant for now as no orange in strict theme, but using primary as fallback accent) -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-2 aspect-square active:scale-95 active:border-secondary active:bg-surface hover:bg-surface-container-highest transition-all duration-150 group">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-colors">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-secondary" style="font-variation-settings: 'FILL' 0;">folder</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Files</span>
</button>
<!-- Brightness (Yellow - mapping to primary/secondary for theme adherence) -->
<button class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col items-center justify-center gap-2 aspect-square active:scale-95 active:border-primary active:bg-surface hover:bg-surface-container-highest transition-all duration-150 group">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-primary" style="font-variation-settings: 'FILL' 0;">brightness_6</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface">Brightness</span>
</button>
</section>
<!-- Trackpad area hint (optional addition to make it feel more complete as requested by design system "Safe Zones") -->
<section class="bg-surface-container rounded-xl border border-outline-variant h-48 mt-4 flex items-center justify-center opacity-50 relative overflow-hidden">
<div class="absolute inset-0 border-2 border-dashed border-outline-variant rounded-xl m-2 pointer-events-none"></div>
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">touchpad_mouse</span>
<span class="font-label-sm text-label-sm text-outline">Quick Trackpad Area</span>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-2 pb-safe bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-t border-outline-variant dark:border-outline-variant md:hidden">
<!-- Dashboard (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-xl px-4 py-1 active:scale-90 transition-transform duration-150 hover:text-primary dark:hover:text-primary min-w-[64px] h-touch-target-min">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-sm text-label-sm mt-1">Dashboard</span>
</button>
<!-- Controls -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 active:scale-90 transition-transform duration-150 hover:text-primary dark:hover:text-primary min-w-[64px] h-touch-target-min">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">videogame_asset</span>
<span class="font-label-sm text-label-sm mt-1">Controls</span>
</button>
<!-- Files -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 active:scale-90 transition-transform duration-150 hover:text-primary dark:hover:text-primary min-w-[64px] h-touch-target-min">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">folder_open</span>
<span class="font-label-sm text-label-sm mt-1">Files</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 active:scale-90 transition-transform duration-150 hover:text-primary dark:hover:text-primary min-w-[64px] h-touch-target-min">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</nav>
</body></html>
