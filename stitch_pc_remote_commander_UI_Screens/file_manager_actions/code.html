<body class="bg-background text-on-background font-body-md antialiased overflow-hidden min-h-screen flex flex-col">
<!-- Mock Background (File Manager) -->
<div class="flex-1 flex flex-col p-margin-mobile opacity-30 pointer-events-none transition-opacity duration-300">
<header class="mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg">C:\Users\Admin\Documents</h1>

<div class="grid grid-cols-2 gap-gutter">

</div>
</div>
</div>

<!-- Overlay Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity duration-300" id="backdrop"></div>
<!-- Bottom Sheet -->
<div aria-labelledby="sheet-title" aria-modal="true" class="fixed bottom-0 left-0 w-full bg-surface-container rounded-t-[24px] z-50 flex flex-col max-h-[90vh] shadow-2xl border-t border-outline-variant transform transition-transform duration-300 translate-y-0" id="bottom-sheet" role="dialog">

<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pb-stack-lg overflow-y-auto">
<!-- File Header -->
<div class="flex flex-col items-center mb-stack-lg mt-2 text-center">
<div class="w-20 h-20 bg-surface-variant rounded-2xl flex items-center justify-center mb-4 border border-outline-variant shadow-sm">

<span class="material-symbols-outlined fill text-primary text-5xl">co_present</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-1 truncate w-full px-4" id="sheet-title">Presentation.pptx</h2>
<p class="font-mono-ui text-mono-ui text-on-surface-variant">2.4 MB • Modified Today 14:32</p>
</div>
<hr class="border-outline-variant mb-stack-lg"/>
<!-- Action List -->
<div class="flex flex-col gap-2">
<!-- Action: Download -->
<button class="w-full h-touch-target-min flex items-center px-4 bg-surface-container-high hover:bg-surface-container-highest rounded-xl border border-outline-variant transition-colors duration-200 group text-left">

</button>

<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors mr-4">edit</span>
<span class="font-label-lg text-label-lg text-on-surface flex-1">Rename</span>
</button>

</button>

</button>

                Cancel
            </button>

<!-- Minimal Script for basic interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('bottom-sheet');
            const backdrop = document.getElementById('backdrop');
            const closeBtn = document.getElementById('close-btn');
            
            // Simple close animation setup (for demonstration, as requested view is 'open' state)
            const closeSheet = () => {
                sheet.style.transform = 'translateY(100%)';
                backdrop.style.opacity = '0';
                setTimeout(() => {
                    // In a real app, this might navigate back or hide the DOM element
                    console.log('Sheet closed');
                    // Reset for demo purposes if needed
                    // sheet.style.transform = 'translateY(0)';
                    // backdrop.style.opacity = '1';
                }, 300);
            };

            closeBtn.addEventListener('click', closeSheet);
            backdrop.addEventListener('click', closeSheet);
            
            // Simulate drag to close (very basic)
            let startY;
            document.getElementById('drag-handle').addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
            });
            document.getElementById('drag-handle').addEventListener('touchend', (e) => {
                let endY = e.changedTouches[0].clientY;
                if (endY - startY > 50) { // Dragged down sufficiently
                    closeSheet();
                }
            });
        });
    </script>
