<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Proton Remote - Device Management</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter & JetBrains Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#00311f",
                        "surface-container": "#171f33",
                        "inverse-primary": "#005ac2",
                        "primary": "#adc6ff",
                        "inverse-on-surface": "#283044",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed": "#001a42",
                        "surface-tint": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "surface-container-lowest": "#060e20",
                        "surface-bright": "#31394d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-low": "#131b2e",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface": "#dae2fd",
                        "on-secondary-container": "#a9bad3",
                        "outline-variant": "#424754",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-container": "#00a572",
                        "inverse-surface": "#dae2fd",
                        "on-surface-variant": "#c2c6d6",
                        "on-error-container": "#ffdad6",
                        "background": "#0b1326",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#0b1c30",
                        "surface": "#0b1326",
                        "on-tertiary-fixed": "#002113",
                        "on-background": "#dae2fd",
                        "on-tertiary": "#003824",
                        "surface-variant": "#2d3449",
                        "surface-dim": "#0b1326",
                        "surface-container-high": "#222a3d",
                        "on-secondary": "#213145",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#d8e2ff",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#004395",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#00285d",
                        "secondary-container": "#3a4a5f",
                        "on-tertiary-fixed-variant": "#005236",
                        "tertiary": "#4edea3",
                        "outline": "#8c909f",
                        "on-primary": "#002e6a",
                        "secondary": "#b7c8e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "mono-ui": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "mono-ui": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom styles for precise stroke weights on Material Symbols */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Hide scrollbar for clean app-like feel */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased flex flex-col min-h-screen relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min transition-colors duration-200">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-container-highest active:scale-95 transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings_remote">settings_remote</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary dark:text-primary tracking-tight">Proton Remote</h1>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-container-highest active:scale-95 transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="sensors">sensors</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-[calc(48px+20px)] pb-[calc(72px+20px)] px-margin-mobile flex flex-col gap-stack-lg">
<header class="flex flex-col gap-1">
<h2 class="font-headline-md text-headline-md text-on-surface">Paired Devices</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Manage connections to your remote environments.</p>
</header>
<!-- Device List -->
<div class="flex flex-col gap-stack-md w-full">
<!-- Connected Device (Gaming-PC) -->
<button class="w-full text-left bg-surface-variant border border-outline-variant rounded-xl p-4 flex items-center justify-between hover:bg-surface-container-highest transition-colors active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-surface-container-low rounded-lg flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="desktop_windows">desktop_windows</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Gaming-PC</span>
<div class="flex items-center gap-2 mt-1">
<span class="w-2 h-2 rounded-full bg-tertiary-fixed"></span>
<span class="font-label-sm text-label-sm text-tertiary-fixed">Connected</span>
</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Offline Device (Work-Laptop) - Showing Swipe-to-Delete State -->
<div class="relative w-full rounded-xl overflow-hidden bg-error-container border border-error-container">
<!-- Background Action (Delete) -->
<div class="absolute inset-y-0 right-0 w-24 flex items-center justify-center">
<button class="w-full h-full flex flex-col items-center justify-center text-on-error-container hover:bg-error transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="delete">delete</span>
<span class="font-label-sm text-label-sm">Delete</span>
</button>
</div>
<!-- Foreground Card (Swiped Left) -->
<button class="relative w-full text-left bg-surface-variant border border-outline-variant rounded-xl p-4 flex items-center justify-between transform -translate-x-20 transition-transform active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-surface-container-low rounded-lg flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-[28px]" data-icon="laptop_mac">laptop_mac</span>
</div>
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface">Work-Laptop</span>
<div class="flex items-center gap-2 mt-1">
<span class="w-2 h-2 rounded-full bg-outline"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Offline</span>
</div>
</div>
</div>
<div class="w-6 h-6 flex items-center justify-center">
<!-- Spacer to balance layout despite swipe -->
</div>
</button>
</div>
</div>
<!-- Add New PC Action -->
<button class="mt-4 h-[56px] w-full bg-primary text-on-primary rounded-xl flex items-center justify-center gap-2 font-label-lg text-label-lg shadow-sm hover:bg-primary-fixed-dim transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="add">add</span>
            Add New PC
        </button>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-t border-outline-variant dark:border-outline-variant fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-2 pb-safe md:hidden">
<!-- Dashboard (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-xl px-4 py-1 active:scale-90 transition-transform duration-150 w-20">
<span class="material-symbols-outlined fill-icon" data-icon="dashboard">dashboard</span>
<span class="font-label-sm text-label-sm mt-1">Dashboard</span>
</button>
<!-- Controls (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary active:scale-90 transition-transform duration-150 w-20">
<span class="material-symbols-outlined" data-icon="videogame_asset">videogame_asset</span>
<span class="font-label-sm text-label-sm mt-1">Controls</span>
</button>
<!-- Files (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary active:scale-90 transition-transform duration-150 w-20">
<span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
<span class="font-label-sm text-label-sm mt-1">Files</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary active:scale-90 transition-transform duration-150 w-20">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</nav>
<!-- Safe area padding for newer iOS devices with home indicators -->
<style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</body></html>
