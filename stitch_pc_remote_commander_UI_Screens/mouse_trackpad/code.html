<body class="antialiased selection:bg-primary-container selection:text-on-primary-container h-[884px] w-full flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-[56px] bg-surface border-b border-outline-variant transition-colors duration-200">
<button class="text-primary hover:bg-surface-container-highest active:scale-95 transition-all duration-200 w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">settings_remote</span>
</button>
<div class="flex flex-col items-center justify-center">
<h1 class="text-headline-sm font-headline-sm font-bold text-primary">Proton Remote</h1>
</div>
<button class="text-on-surface-variant hover:bg-surface-container-highest active:scale-95 transition-all duration-200 w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">sensors</span>
</button>
</header>
<!-- Main Content: Trackpad Surface -->
<main class="flex-1 w-full pt-[56px] pb-[72px] flex flex-col relative px-margin-mobile py-margin-mobile">
<div class="flex-1 flex flex-col mt-4 mb-2 bg-surface-container rounded-xl border border-outline-variant shadow-sm overflow-hidden">
<!-- Gesture Area -->
<div class="flex-1 touch-none relative group cursor-crosshair">
<!-- Subtle inner glow on interaction -->
<div class="absolute inset-0 bg-primary/0 group-active:bg-primary/5 transition-colors duration-300 pointer-events-none"></div>
<!-- Center Icon / Indicator -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-[64px] text-surface-bright opacity-30 group-active:text-primary group-active:opacity-20 transition-all duration-500">touchpad_mouse</span>
</div>
</div>
<!-- Divider -->
<div class="w-full h-px bg-outline-variant"></div>
<!-- Mouse Buttons -->
<div class="flex h-[80px] bg-surface-container-high">
<button class="flex-1 flex items-center justify-center hover:bg-surface-container-highest active:bg-primary active:text-on-primary transition-colors duration-150">
<span class="font-label-lg text-label-lg tracking-wider">Left Click</span>
</button>
<div class="w-px h-full bg-outline-variant"></div>
<button class="flex-1 flex items-center justify-center hover:bg-surface-container-highest active:bg-primary active:text-on-primary transition-colors duration-150">
<span class="font-label-lg text-label-lg tracking-wider">Right Click</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter py-2 pb-safe bg-surface/80 backdrop-blur-xl border-t border-outline-variant shadow-[0_-4px_24px_rgba(0,0,0,0.4)]">

</button>

<span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 1;">videogame_asset</span>
