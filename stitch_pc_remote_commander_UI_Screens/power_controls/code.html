<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Proton Remote - Power Controls</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#00311f",
                        "surface-container": "#171f33",
                        "inverse-primary": "#005ac2",
                        "primary": "#adc6ff",
                        "inverse-on-surface": "#283044",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed": "#001a42",
                        "surface-tint": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "surface-container-lowest": "#060e20",
                        "surface-bright": "#31394d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-low": "#131b2e",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface": "#dae2fd",
                        "on-secondary-container": "#a9bad3",
                        "outline-variant": "#424754",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-container": "#00a572",
                        "inverse-surface": "#dae2fd",
                        "on-surface-variant": "#c2c6d6",
                        "on-error-container": "#ffdad6",
                        "background": "#0b1326",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#0b1c30",
                        "surface": "#0b1326",
                        "on-tertiary-fixed": "#002113",
                        "on-background": "#dae2fd",
                        "on-tertiary": "#003824",
                        "surface-variant": "#2d3449",
                        "surface-dim": "#0b1326",
                        "surface-container-high": "#222a3d",
                        "on-secondary": "#213145",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#d8e2ff",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#004395",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#00285d",
                        "secondary-container": "#3a4a5f",
                        "on-tertiary-fixed-variant": "#005236",
                        "tertiary": "#4edea3",
                        "outline": "#8c909f",
                        "on-primary": "#002e6a",
                        "secondary": "#b7c8e1"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "stack-lg": "24px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "touch-target-min": "48px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "mono-ui": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
                        "mono-ui": ["14px", { lineHeight: "20px", fontWeight: "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-animate {
            animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen antialiased flex flex-col select-none">
<!-- TopAppBar Shell Component -->
<header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center px-margin-mobile h-touch-target-min bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant transition-colors duration-200">
<button class="text-primary dark:text-primary hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors duration-200 active:scale-95 w-touch-target-min h-touch-target-min flex items-center justify-center -ml-3 rounded-full">
<span class="material-symbols-outlined text-2xl">settings_remote</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary dark:text-primary tracking-tight">Proton Remote</h1>
<button class="text-primary dark:text-primary hover:bg-surface-container-highest dark:hover:bg-surface-container-highest transition-colors duration-200 active:scale-95 w-touch-target-min h-touch-target-min flex items-center justify-center -mr-3 rounded-full">
<span class="material-symbols-outlined text-2xl">sensors</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 pt-[calc(48px+24px)] pb-[calc(60px+24px)] px-margin-mobile flex flex-col gap-stack-lg max-w-md mx-auto w-full">
<!-- Status Indicator -->
<div class="flex items-center justify-center gap-3 py-2.5 px-5 bg-surface-container-low border border-outline-variant rounded-full mx-auto shadow-sm backdrop-blur-md">
<div class="relative flex items-center justify-center w-3 h-3">
<span class="absolute inline-flex h-full w-full rounded-full bg-tertiary opacity-40 animate-ping"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary shadow-[0_0_8px_rgba(78,222,163,0.8)]"></span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wide">Connected to <strong class="text-on-surface font-semibold">Gaming-PC</strong></span>
</div>
<!-- Power Controls Grid (2x3) -->
<div class="grid grid-cols-2 gap-gutter mt-2">
<!-- Shutdown Tile (Simulating Pressed/Active state via Modal below) -->
<button class="group relative flex flex-col items-center justify-center aspect-square bg-surface-container border border-outline-variant rounded-xl transition-all duration-200 hover:bg-surface-container-high hover:border-outline active:scale-95 overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-highest opacity-50"></div>
<span class="material-symbols-outlined text-[40px] text-on-surface-variant group-hover:text-primary transition-colors duration-200 mb-stack-sm relative z-10" style="font-variation-settings: 'wght' 200;">power_settings_new</span>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors duration-200 relative z-10">Shutdown</span>
</button>
<!-- Restart Tile -->
<button class="group relative flex flex-col items-center justify-center aspect-square bg-surface-container border border-outline-variant rounded-xl transition-all duration-200 hover:bg-surface-container-high hover:border-outline active:scale-95 overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-highest opacity-50"></div>
<span class="material-symbols-outlined text-[40px] text-on-surface-variant group-hover:text-primary transition-colors duration-200 mb-stack-sm relative z-10" style="font-variation-settings: 'wght' 200;">restart_alt</span>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors duration-200 relative z-10">Restart</span>
</button>
<!-- Sleep Tile -->
<button class="group relative flex flex-col items-center justify-center aspect-square bg-surface-container border border-outline-variant rounded-xl transition-all duration-200 hover:bg-surface-container-high hover:border-outline active:scale-95 overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-highest opacity-50"></div>
<span class="material-symbols-outlined text-[40px] text-on-surface-variant group-hover:text-primary transition-colors duration-200 mb-stack-sm relative z-10" style="font-variation-settings: 'wght' 200;">mode_night</span>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors duration-200 relative z-10">Sleep</span>
</button>
<!-- Hibernate Tile -->
<button class="group relative flex flex-col items-center justify-center aspect-square bg-surface-container border border-outline-variant rounded-xl transition-all duration-200 hover:bg-surface-container-high hover:border-outline active:scale-95 overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-highest opacity-50"></div>
<span class="material-symbols-outlined text-[40px] text-on-surface-variant group-hover:text-primary transition-colors duration-200 mb-stack-sm relative z-10" style="font-variation-settings: 'wght' 200;">bedtime</span>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors duration-200 relative z-10">Hibernate</span>
</button>
<!-- Log off Tile -->
<button class="group relative flex flex-col items-center justify-center aspect-square bg-surface-container border border-outline-variant rounded-xl transition-all duration-200 hover:bg-surface-container-high hover:border-outline active:scale-95 overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-highest opacity-50"></div>
<span class="material-symbols-outlined text-[40px] text-on-surface-variant group-hover:text-primary transition-colors duration-200 mb-stack-sm relative z-10" style="font-variation-settings: 'wght' 200;">logout</span>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors duration-200 relative z-10">Log off</span>
</button>
<!-- Lock Tile -->
<button class="group relative flex flex-col items-center justify-center aspect-square bg-surface-container border border-outline-variant rounded-xl transition-all duration-200 hover:bg-surface-container-high hover:border-outline active:scale-95 overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-highest opacity-50"></div>
<span class="material-symbols-outlined text-[40px] text-on-surface-variant group-hover:text-primary transition-colors duration-200 mb-stack-sm relative z-10" style="font-variation-settings: 'wght' 200;">lock</span>
<span class="font-label-sm text-label-sm text-on-surface group-hover:text-primary transition-colors duration-200 relative z-10">Lock</span>
</button>
</div>
</main>
<!-- Confirmation Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center px-margin-mobile bg-background/80 backdrop-blur-xl transition-opacity duration-300">
<div class="bg-surface-container-highest border border-outline-variant rounded-2xl p-stack-lg w-full max-w-sm shadow-2xl flex flex-col gap-stack-md modal-animate relative overflow-hidden">
<!-- Decorative subtle glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-error-container/20 rounded-full blur-3xl"></div>
<div class="flex items-start gap-4 relative z-10">
<div class="w-12 h-12 rounded-full bg-error-container/20 flex items-center justify-center shrink-0 border border-error-container/30">
<span class="material-symbols-outlined text-error text-[28px]" style="font-variation-settings: 'FILL' 1;">power_settings_new</span>
</div>
<div class="flex flex-col gap-1 pt-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Shutdown PC?</h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                        Are you sure you want to completely power off <strong class="text-on-surface font-medium">Gaming-PC</strong>? Any unsaved work will be lost.
                    </p>
</div>
</div>
<div class="flex gap-gutter mt-4 relative z-10">
<!-- Ghost Button for Cancel -->
<button class="flex-1 h-touch-target-min font-label-lg text-label-lg text-on-surface bg-transparent border border-outline-variant hover:bg-surface-container-high rounded-xl transition-colors duration-200">
                    Cancel
                </button>
<!-- Destructive Primary Action -->
<button class="flex-1 h-touch-target-min font-label-lg text-label-lg text-on-error-container bg-error-container hover:bg-error-container/90 border border-error-container/50 rounded-xl transition-all duration-200 shadow-[0_4px_12px_rgba(147,0,10,0.2)] active:scale-95">
                    Confirm
                </button>
</div>
</div>
</div>
<!-- BottomNavBar Shell Component -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-gutter py-2 pb-safe bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-t border-outline-variant dark:border-outline-variant transition-colors duration-200 md:hidden">
<!-- Dashboard (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary active:scale-90 transition-all duration-150 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</button>
<!-- Controls (Active Semantic Match) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-xl px-4 py-1 active:scale-90 transition-all duration-150 shadow-sm">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">videogame_asset</span>
<span class="font-label-sm text-label-sm font-bold">Controls</span>
</button>
<!-- Files (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary active:scale-90 transition-all duration-150 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">folder_open</span>
<span class="font-label-sm text-label-sm">Files</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-primary active:scale-90 transition-all duration-150 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</button>
</nav>
</body></html>
