<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Proton Remote - Pairing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#00311f",
                        "surface-container": "#171f33",
                        "inverse-primary": "#005ac2",
                        "primary": "#adc6ff",
                        "inverse-on-surface": "#283044",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-fixed": "#001a42",
                        "surface-tint": "#adc6ff",
                        "primary-container": "#4d8eff",
                        "surface-container-lowest": "#060e20",
                        "surface-bright": "#31394d",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-low": "#131b2e",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface": "#dae2fd",
                        "on-secondary-container": "#a9bad3",
                        "outline-variant": "#424754",
                        "tertiary-fixed-dim": "#4edea3",
                        "tertiary-container": "#00a572",
                        "inverse-surface": "#dae2fd",
                        "on-surface-variant": "#c2c6d6",
                        "on-error-container": "#ffdad6",
                        "background": "#0b1326",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#0b1c30",
                        "surface": "#0b1326",
                        "on-tertiary-fixed": "#002113",
                        "on-background": "#dae2fd",
                        "on-tertiary": "#003824",
                        "surface-variant": "#2d3449",
                        "surface-dim": "#0b1326",
                        "surface-container-high": "#222a3d",
                        "on-secondary": "#213145",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#d8e2ff",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#004395",
                        "primary-fixed-dim": "#adc6ff",
                        "on-primary-container": "#00285d",
                        "secondary-container": "#3a4a5f",
                        "on-tertiary-fixed-variant": "#005236",
                        "tertiary": "#4edea3",
                        "outline": "#8c909f",
                        "on-primary": "#002e6a",
                        "secondary": "#b7c8e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "mono-ui": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "mono-ui": ["14px", { "lineHeight": "20px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: theme('colors.surface-container-highest');
            transition: all 0.2s ease;
        }
        
        .pin-dot.filled {
            background-color: theme('colors.primary');
            box-shadow: 0 0 12px theme('colors.primary');
        }

        .keypad-btn {
            height: 64px;
            border-radius: theme('borderRadius.xl');
            background-color: theme('colors.surface-container');
            color: theme('colors.on-surface');
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
            border: 1px solid theme('colors.outline-variant');
        }

        .keypad-btn:active {
            background-color: theme('colors.surface-container-highest');
            transform: scale(0.95);
            border-color: theme('colors.primary');
        }
        
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(173, 198, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(173, 198, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(173, 198, 255, 0); }
        }
        
        .loading-active {
            animation: pulse-border 2s infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg selection:bg-primary-container selection:text-on-primary-container antialiased">
<!-- Top App Bar (Suppressed Navbar for Transactional Flow, just a back button and title) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-margin-mobile h-touch-target-min bg-surface/90 backdrop-blur-md border-b border-outline-variant">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-headline-sm text-headline-sm text-primary pr-10">Proton Remote</h1>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col justify-center px-margin-mobile pt-[80px] pb-safe max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="text-center mb-stack-lg">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mx-auto mb-stack-md border border-outline-variant">
<span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">devices</span>
</div>
<h2 class="font-headline-lg text-headline-lg mb-stack-sm">Enter PIN</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the code shown on your PC display.</p>
</div>
<!-- PIN Display Area -->
<div class="flex justify-center gap-4 mb-12">
<div class="pin-dot filled" id="dot-1"></div>
<div class="pin-dot filled" id="dot-2"></div>
<div class="pin-dot filled" id="dot-3"></div>
<div class="pin-dot" id="dot-4"></div>
<div class="pin-dot" id="dot-5"></div>
<div class="pin-dot" id="dot-6"></div>
</div>
<!-- Numeric Keypad (Glassmorphism inspired container) -->
<div class="bg-surface-container-low p-6 rounded-2xl border border-surface-container-highest backdrop-blur-lg mb-stack-lg shadow-lg">
<div class="grid grid-cols-3 gap-gutter">
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('1')">1</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('2')">2</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('3')">3</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('4')">4</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('5')">5</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('6')">6</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('7')">7</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('8')">8</button>
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('9')">9</button>
<div class="col-span-1"></div> <!-- Empty space -->
<button class="keypad-btn font-headline-md text-headline-md" onclick="addPin('0')">0</button>
<button class="keypad-btn text-on-surface-variant bg-transparent border-transparent hover:bg-surface-container-highest" onclick="removePin()">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
</div>
<!-- Action Area (Simulating loading state) -->
<div class="mt-auto pb-8">
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-2 transition-all duration-300 shadow-[0_0_15px_rgba(173,198,255,0.2)] hover:shadow-[0_0_20px_rgba(173,198,255,0.4)]" id="pairBtn" onclick="simulatePairing()">
<span id="btnText">Pair Device</span>
<span class="material-symbols-outlined text-[20px]" id="btnIcon">link</span>
</button>
</div>
</main>
<script>
        let currentPinLength = 3; // Starting with 3 filled for demo

        function updateDots() {
            for (let i = 1; i <= 6; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i <= currentPinLength) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function addPin(num) {
            if (currentPinLength < 6) {
                currentPinLength++;
                updateDots();
                if(currentPinLength === 6) {
                    simulatePairing();
                }
            }
        }

        function removePin() {
            if (currentPinLength > 0) {
                currentPinLength--;
                updateDots();
            }
        }

        function simulatePairing() {
            const btn = document.getElementById('pairBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            
            if(btn.classList.contains('loading-active')) return;

            // Set to loading state
            btn.classList.remove('bg-primary', 'text-on-primary');
            btn.classList.add('bg-surface-container-highest', 'text-primary', 'loading-active', 'border', 'border-primary');
            btnText.innerText = "Pairing...";
            btnIcon.innerText = "sync";
            btnIcon.classList.add('animate-spin');

            // Reset after 3 seconds for demo purposes
            setTimeout(() => {
                btn.classList.add('bg-primary', 'text-on-primary');
                btn.classList.remove('bg-surface-container-highest', 'text-primary', 'loading-active', 'border', 'border-primary');
                btnText.innerText = "Pair Device";
                btnIcon.innerText = "link";
                btnIcon.classList.remove('animate-spin');
                currentPinLength = 0;
                updateDots();
            }, 3000);
        }
    </script>
</body></html>
